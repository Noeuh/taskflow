spring.application.name=taskflow-backend
# spring-dotenv looks for .env relative to the backend working directory.
springdotenv.directory=..
# ── Base de données ──────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ── JPA / Hibernate ──────────────────────────────────────────────────
# "update" : Hibernate crée/modifie les tables automatiquement à partir de tes entités
# ⚠️ Ne jamais utiliser "update" en production, uniquement en développement
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── JWT ──────────────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:86400000}    # Fallback : 24h si non défini

# ── Serveur ──────────────────────────────────────────────────────────
server.port=8080